name: DITA Validierung

# ============================================================
# WANN LÄUFT DIE PIPELINE?
# ============================================================
# Push auf beliebigen Branch:
#   → Pipeline läuft, Fehler erzeugen nur eine Warnung.
#   → Autor bekommt automatisch eine E-Mail von GitHub.
#   → Der Push wird NICHT blockiert.
#
# Pull Request nach develop oder main:
#   → Pipeline läuft verbindlich.
#   → Fehler blockieren den Merge (Branch Protection Rule
#     muss in GitHub einmalig aktiviert werden – siehe unten).
# ============================================================

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  validierung:
    runs-on: ubuntu-24.04

    # Bei Push: Fehler erzeugen eine Warnung, blockieren aber nicht.
    # Bei Pull Request: Fehler blockieren den Merge.
    continue-on-error: ${{ github.event_name == 'push' && !contains(fromJSON('["develop", "main"]'), github.ref_name) }}

    steps:

      # ----------------------------------------------------------
      # 1. Repo auschecken (inkl. Submodul shared/)
      #
      # Das Submodul (test-shared bzw. kunde-xyz-shared) ist ein
      # privates Repository. GitHub Actions hat darauf keinen
      # automatischen Zugriff. Der Personal Access Token (PAT)
      # wird als Secret im Produktrepo hinterlegt und hier
      # übergeben, damit das Submodul ausgecheckt werden kann.
      #
      # SECRET EINRICHTEN (einmalig pro Produktrepo):
      #   GitHub → test-produkt → Settings →
      #   Secrets and variables → Actions →
      #   New repository secret
      #   Name:  SUBMODULE_PAT
      #   Value: Personal Access Token mit repo-Berechtigung
      #
      # PAT ERSTELLEN (einmalig pro GitHub-Account):
      #   GitHub → Profilbild → Settings →
      #   Developer settings →
      #   Personal access tokens → Tokens (classic) →
      #   Generate new token (classic)
      #   Berechtigung: repo (alle Unterberechtigungen)
      # ----------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_PAT }}

      # ----------------------------------------------------------
      # 2. Java einrichten (für Saxon)
      # ----------------------------------------------------------
      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ----------------------------------------------------------
      # 3. Saxon-HE und xmlresolver herunterladen
      #    Maven ist auf ubuntu-24.04 vorinstalliert und löst
      #    Abhängigkeiten automatisch auf. Saxon 12 benötigt
      #    xmlresolver als Laufzeitabhängigkeit.
      # ----------------------------------------------------------
      - name: Saxon-HE herunterladen
        run: |
          mkdir -p /opt/saxon
          # Saxon-HE und xmlresolver per Maven dependency:copy laden
          mvn dependency:copy \
            -Dartifact=net.sf.saxon:Saxon-HE:12.9 \
            -DoutputDirectory=/opt/saxon \
            --quiet
          mvn dependency:copy \
            -Dartifact=org.xmlresolver:xmlresolver:5.2.2 \
            -DoutputDirectory=/opt/saxon \
            --quiet
          # Classpath für nachfolgende Schritte bereitstellen
          SAXON_JARS=$(find /opt/saxon -name '*.jar' | tr '\n' ':')
          echo "SAXON_JARS=${SAXON_JARS}" >> $GITHUB_ENV
          echo "Saxon JARs: ${SAXON_JARS}"

      # ----------------------------------------------------------
      # 4. DITA-OT herunterladen
      #    Wird für DTD-Validierung und ggf. Publishing genutzt.
      # ----------------------------------------------------------
      - name: DITA-OT herunterladen
        run: |
          curl -L -o /tmp/dita-ot.zip \
            "https://github.com/dita-ot/dita-ot/releases/download/4.4/dita-ot-4.4.zip"
          unzip -q /tmp/dita-ot.zip -d /opt/
          mv /opt/dita-ot-4.4 /opt/dita-ot

      # ----------------------------------------------------------
      # 6. DITA-Dateien ermitteln
      #
      # Bei Pull Request:
      #   Nur geänderte Dateien prüfen (git diff gegen Basis-Branch).
      #   Zuverlässig, weil origin/[basis] immer vorhanden ist.
      #
      # Bei Push:
      #   Normalfall: git diff gegen Merge-Basis (Abzweigpunkt
      #   des Branches von develop). Liefert genau die Dateien,
      #   die auf diesem Branch geändert wurden.
      #
      #   Fallback: Wenn keine Merge-Basis gefunden wird (z.B.
      #   erster Commit auf einem Branch ohne Vorgänger, oder
      #   Branch Protection Rule nicht aktiv), werden ALLE
      #   DITA-Dateien im Repo geprüft. Lieber einmal zu viel
      #   prüfen als eine Lücke riskieren.
      #   Dieser Fall sollte im Normalbetrieb nie eintreten,
      #   da direkte Pushes auf develop und main durch Branch
      #   Protection Rules blockiert sind.
      # ----------------------------------------------------------
      - name: DITA-Dateien ermitteln
        id: dita_dateien
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pull Request: geänderte Dateien gegen Basis-Branch
            DATEIEN=$(git diff --name-only \
              origin/${{ github.base_ref }}...HEAD \
              -- '*.dita' '*.ditamap' | tr '\n' ' ')
          else
            # Push: Merge-Basis berechnen
            git fetch origin develop --depth=50 2>/dev/null || true
            BASE=$(git merge-base HEAD origin/develop 2>/dev/null || echo "")

            if [ -n "$BASE" ]; then
              # Normalfall: nur auf diesem Branch geänderte Dateien
              DATEIEN=$(git diff --name-only "$BASE" HEAD \
                -- '*.dita' '*.ditamap' | tr '\n' ' ')
            else
              # Fallback: alle DITA-Dateien prüfen
              echo "HINWEIS: Keine Merge-Basis gefunden." \
                   "Prüfe alle DITA-Dateien im Repo (sicherer Fallback)."
              DATEIEN=$(find . \( -name '*.dita' -o -name '*.ditamap' \) \
                | grep -v '^\./\.git' \
                | tr '\n' ' ')
            fi
          fi
          echo "dateien=$DATEIEN" >> $GITHUB_OUTPUT
          echo "Gefundene DITA-Dateien: $DATEIEN"

      # ----------------------------------------------------------
      # 7. DTD-Validierung mit xmllint
      #    Prüft jede geänderte Datei gegen die DITA-DTD.
      #    Der XML-Katalog von DITA-OT löst die DTD-Referenzen auf.
      #    WICHTIG: xmllint liest den Katalog über die Umgebungs-
      #    variable SGML_CATALOG_FILES, nicht über --catalogs.
      # ----------------------------------------------------------
      # ----------------------------------------------------------
      # 7. DTD-Validierung mit DITA-OT
      #    DITA-OT versteht die DITA 1.3 DTDs vollständig,
      #    einschließlich des SVG-Domain-Moduls. xmllint ist
      #    dafür ungeeignet (Entity-Referenzschleifen in
      #    svgDomain.mod).
      #    Der Befehl --format=dita führt nur Validierung durch,
      #    ohne Publishing-Output zu erzeugen.
      #    Eine Map wird als Einstiegspunkt benötigt – wir nutzen
      #    die Haupt-Map des Projekts.
      # ----------------------------------------------------------
      - name: DTD-Validierung
        if: steps.dita_dateien.outputs.dateien != ''
        run: |
          FEHLER=0
          DITA_OT="/opt/dita-ot/bin/dita"

          # DITA-OT validiert immer über eine Map als Einstiegspunkt.
          # Alle Maps im Repo ermitteln und einzeln validieren.
          # Topics werden dabei automatisch mitvalidiert.
          MAPS=$(find . -name '*.ditamap' \
            | grep -v '^\./\.git' \
            | grep -v 'relationship_table' \
            | tr '\n' ' ')

          for MAP in $MAPS; do
            if [ -f "$MAP" ]; then
              echo "Validiere: $MAP"
              if ! $DITA_OT --input="$MAP" \
                            --format=dita \
                            --output=/tmp/dita-validate-out \
                            2>&1; then
                echo "DTD-FEHLER in: $MAP"
                FEHLER=1
              fi
            fi
          done

          if [ $FEHLER -ne 0 ]; then
            echo ""
            echo "❌ DTD-Validierung fehlgeschlagen."
            echo "Bitte die oben angezeigten Fehler korrigieren."
            exit 1
          else
            echo ""
            echo "✅ DTD-Validierung erfolgreich."
          fi

      # ----------------------------------------------------------
      # 8. Schematron-Validierung mit Saxon
      #    Dreistufige Pipeline:
      #    a) Schematron → XSLT kompilieren (iso_svrl_for_xslt2.xsl)
      #    b) XSLT auf jede DITA-Datei anwenden → SVRL-Ergebnis
      #    c) SVRL auf Fehler prüfen
      #
      #    Skeleton-Dateien liegen in shared/schematron/
      #    Schematron-Regeln liegen in shared/schematron/dita_rules.sch
      # ----------------------------------------------------------
      - name: Schematron-Validierung
        if: steps.dita_dateien.outputs.dateien != ''
        run: |
          FEHLER=0
          # Debug: Arbeitsverzeichnis und Submodul-Inhalt prüfen
          echo "Arbeitsverzeichnis: $(pwd)"
          echo "Inhalt shared/schematron/:"
          ls -la shared/schematron/ 2>&1 || echo "Ordner nicht gefunden"

          # Vollständigen Classpath mit allen Saxon-JARs verwenden
          # (inkl. xmlresolver, der von Saxon 12 benötigt wird)
          SAXON="java -cp $SAXON_JARS net.sf.saxon.Transform"
          SKELETON="shared/schematron/iso_svrl_for_xslt2.xsl"
          REGELN="shared/schematron/dita_rules.sch"
          KOMPILIERT="/tmp/dita_rules_compiled.xsl"

          # Schritt a: Schematron-Regeln in XSLT kompilieren
          echo "Kompiliere Schematron-Regeln..."
          if ! $SAXON -s:"$REGELN" \
                      -xsl:"$SKELETON" \
                      -o:"$KOMPILIERT" 2>&1; then
            echo "❌ Schematron-Kompilierung fehlgeschlagen."
            exit 1
          fi
          echo "Kompilierung erfolgreich. Prüfe Output..."
          ls -la "$KOMPILIERT" 2>&1 || echo "Kompiliertes XSLT nicht gefunden!"

          # Schritt b+c: Kompiliertes XSLT auf jede Datei anwenden
          for DATEI in ${{ steps.dita_dateien.outputs.dateien }}; do
            if [ -f "$DATEI" ] && [[ "$DATEI" == *.dita ]]; then
              echo "Prüfe: $DATEI"
              ERGEBNIS=$($SAXON -s:"$DATEI" \
                                -xsl:"$KOMPILIERT" 2>&1)
              EXITCODE=$?

              # Saxon-Exitcode prüfen (2 = Transformation fehlgeschlagen)
              if [ $EXITCODE -ne 0 ]; then
                echo "Saxon-Fehler (exit $EXITCODE) bei: $DATEI"
                echo "$ERGEBNIS"
                FEHLER=1
                continue
              fi

              # Auf fehlgeschlagene Assertions prüfen (role="error")
              if echo "$ERGEBNIS" | grep -q "failed-assert"; then
                echo "$ERGEBNIS"
                echo "SCHEMATRON-FEHLER in: $DATEI"
                FEHLER=1
              fi

              # Warnungen anzeigen (role="warning"), aber nicht blockieren
              if echo "$ERGEBNIS" | grep -q "successful-report"; then
                echo "SCHEMATRON-WARNUNG in: $DATEI"
                echo "$ERGEBNIS" | grep -A2 "successful-report"
              fi
            fi
          done

          if [ $FEHLER -ne 0 ]; then
            echo ""
            echo "❌ Schematron-Validierung fehlgeschlagen."
            echo "Bitte die oben angezeigten Fehler korrigieren."
            exit 1
          else
            echo ""
            echo "✅ Schematron-Validierung erfolgreich."
          fi

# ============================================================
# BRANCH PROTECTION RULE IN GITHUB EINRICHTEN
# ============================================================
# Damit Pull Requests bei Fehlern blockiert werden, muss in
# GitHub einmalig eine Branch Protection Rule aktiviert werden:
#
# 1. GitHub → test-produkt → Settings → Branches
# 2. "Add branch protection rule" klicken
# 3. Branch name pattern: develop
# 4. Haken setzen bei:
#    ✅ Require status checks to pass before merging
#    ✅ Require branches to be up to date before merging
#    Unter "Status checks": "validierung" suchen und auswählen
# 5. Speichern – dasselbe für "main" wiederholen
#
# Hinweis: Der Status-Check "validierung" erscheint in der
# Suche erst, nachdem die Pipeline mindestens einmal gelaufen ist.
# ============================================================
